aid: hydrolix
name: Hydrolix
description: >-
  Hydrolix is a real-time log analytics and observability platform built as a streaming data lake:
  it decouples ingest, storage, and compute so teams can retain full-fidelity log and event data
  cost-effectively for 15+ months while still serving low-latency queries and dashboards. Data is
  ingested through an HTTP Streaming API, Amazon Kinesis / Data Firehose, S3 autoingest, and
  OpenTelemetry, then queried with the ClickHouse SQL dialect via a Query API, MCP server, and
  connectors for Grafana, Trino, Spark/Databricks, and Splunk. Hydrolix deploys in the customer's
  own cloud (BYOC on AWS/GCP/Kubernetes) and exposes a Config API, Stream API, and Query API,
  a hdxcli command-line tool, and an official Model Context Protocol server.
